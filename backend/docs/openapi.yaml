openapi: 3.1.0
info:
  title: FlawFinder AI API
  description: The Ruthless Business & ML Critic - Backend API
  version: 1.0.0
  contact:
    name: FlawFinder AI Team
    email: support@flawfinder.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: https://api.flawfinder.ai/api/v1
    description: Production server

paths:
  # Authentication endpoints
  /auth/register:
    post:
      summary: Register a new user
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login user
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/logout:
    post:
      summary: Logout user
      tags: [authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful

  /auth/me:
    get:
      summary: Get current user info
      tags: [authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  # Process flows endpoints
  /flows:
    get:
      summary: Get all flows for current user
      tags: [flows]
      security:
        - BearerAuth: []
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: List of flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessFlowResponse'

    post:
      summary: Create a new process flow
      tags: [flows]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessFlowCreate'
      responses:
        '201':
          description: Flow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessFlowResponse'

  /flows/{flow_id}:
    get:
      summary: Get a specific flow
      tags: [flows]
      security:
        - BearerAuth: []
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Flow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessFlowResponse'

  /flows/{flow_id}/parse:
    post:
      summary: Parse a process flow
      tags: [flows]
      security:
        - BearerAuth: []
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Flow parsed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowParseResponse'

  /flows/{flow_id}/score:
    get:
      summary: Get brutality score for a flow
      tags: [flows]
      security:
        - BearerAuth: []
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Brutality score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrutalityScoreResponse'

  /flows/{flow_id}/fixes:
    get:
      summary: Get role-based fixes for a flow
      tags: [flows]
      security:
        - BearerAuth: []
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: integer
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [engineer, ops, data, exec]
      responses:
        '200':
          description: Role-based fixes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # Reports endpoints
  /reports/ceo:
    post:
      summary: Generate CEO report
      tags: [reports]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CEOReportRequest'
      responses:
        '201':
          description: CEO report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'

  /reports:
    get:
      summary: Get all reports for current user
      tags: [reports]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'

  /reports/{report_id}:
    get:
      summary: Get a specific report
      tags: [reports]
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'

  /reports/{report_id}/download:
    get:
      summary: Download report file
      tags: [reports]
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Report download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string

  # AgentOps endpoints
  /agentops/pipelines:
    post:
      summary: Register a new ML pipeline
      tags: [agentops]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
      responses:
        '201':
          description: Pipeline registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'

    get:
      summary: Get all pipelines for current user
      tags: [agentops]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pipelines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineResponse'

  /agentops/pipelines/{pipeline_id}:
    get:
      summary: Get a specific pipeline
      tags: [agentops]
      security:
        - BearerAuth: []
      parameters:
        - name: pipeline_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pipeline details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'

  /agentops/pipelines/{pipeline_id}/monitor:
    post:
      summary: Capture drift metrics for a pipeline
      tags: [agentops]
      security:
        - BearerAuth: []
      parameters:
        - name: pipeline_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftMetricCreate'
      responses:
        '201':
          description: Drift metric captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftMetricResponse'

  /agentops/pipelines/{pipeline_id}/retrain:
    post:
      summary: Trigger model retraining for a pipeline
      tags: [agentops]
      security:
        - BearerAuth: []
      parameters:
        - name: pipeline_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Retraining triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  retraining_id:
                    type: integer

  /agentops/pipelines/{pipeline_id}/status:
    get:
      summary: Get current pipeline health and status
      tags: [agentops]
      security:
        - BearerAuth: []
      parameters:
        - name: pipeline_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pipeline status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStatusResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Base schemas
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    # Authentication schemas
    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    UserRegister:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [admin, analyst, engineer, exec]
          default: analyst

    Token:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        status:
          type: string
        organization_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Flow schemas
    ProcessFlowCreate:
      type: object
      required:
        - name
        - raw_input
      properties:
        name:
          type: string
        description:
          type: string
        raw_input:
          type: string
        organization_id:
          type: integer

    ProcessFlowResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        status:
          type: string
        brutality_score:
          type: number
        user_id:
          type: integer
        organization_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FlowParseResponse:
      type: object
      properties:
        flow_id:
          type: integer
        parsed_graph:
          type: object
        findings:
          type: array
          items:
            type: object
        status:
          type: string

    BrutalityScoreResponse:
      type: object
      properties:
        flow_id:
          type: integer
        score:
          type: number
        breakdown:
          type: object
        version:
          type: string

    # Report schemas
    CEOReportRequest:
      type: object
      properties:
        flow_id:
          type: integer
        include_departments:
          type: boolean
          default: true
        format:
          type: string
          enum: [pdf, json]
          default: pdf

    ReportResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        report_type:
          type: string
        status:
          type: string
        content:
          type: object
        file_url:
          type: string
        metadata:
          type: object
        user_id:
          type: integer
        process_flow_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # AgentOps schemas
    PipelineCreate:
      type: object
      required:
        - name
        - model_path
        - metrics_endpoint
      properties:
        name:
          type: string
        description:
          type: string
        model_path:
          type: string
        metrics_endpoint:
          type: string
        metadata:
          type: object

    PipelineResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        model_path:
          type: string
        metrics_endpoint:
          type: string
        status:
          type: string
        metadata:
          type: object
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriftMetricCreate:
      type: object
      required:
        - drift_type
        - metric_value
        - threshold
      properties:
        drift_type:
          type: string
          enum: [data_drift, concept_drift, label_drift]
        metric_value:
          type: number
        threshold:
          type: number
        metadata:
          type: object

    DriftMetricResponse:
      type: object
      properties:
        id:
          type: integer
        drift_type:
          type: string
        metric_value:
          type: number
        threshold:
          type: number
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
        pipeline_id:
          type: integer

    PipelineStatusResponse:
      type: object
      properties:
        pipeline_id:
          type: integer
        status:
          type: string
        last_retrain:
          type: string
          format: date-time
        latest_metrics:
          type: array
          items:
            type: object
        health_score:
          type: number 